name: Auto-publish Provider Snapshots

on:
  push:
    branches: [main]
    paths:
      - 'agent/**'
      - 'runtime/**'
      - 'app/**'
      - 'auth/**'
      - 'authorization/**'
      - 'externalcredentials/**'
      - 's3/**'
      - 'indexeddb/**'
      - 'workflow/**'
      - 'cache/**'
      - 'secrets/**'

permissions:
  contents: read
  id-token: write

jobs:
  changed-providers:
    runs-on: ubuntu-latest
    outputs:
      providers: ${{ steps.detect.outputs.providers }}
      gestalt-ref: ${{ steps.detect.outputs.gestalt-ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          providers=$(python3 - <<'PY'
          import json
          import os
          import pathlib
          import subprocess

          before = os.environ["BEFORE"]
          after = os.environ["AFTER"]
          if before == "0" * 40:
              before = subprocess.check_output(
                  ["git", "rev-parse", f"{after}^"],
                  text=True,
              ).strip()

          roots = {
              "agent", "runtime", "app", "auth", "authorization", "externalcredentials",
              "s3", "indexeddb", "workflow", "cache", "secrets",
          }
          diff = subprocess.check_output(
              [
                  "git", "diff", "--name-only", before, after, "--",
                  *sorted(roots),
              ],
              text=True,
          )

          providers = []
          seen = set()
          for raw in diff.splitlines():
              path = pathlib.PurePosixPath(raw.strip())
              if len(path.parts) < 2 or path.parts[0] not in roots:
                  continue
              provider_dir = pathlib.PurePosixPath(path.parts[0], path.parts[1]).as_posix()
              if provider_dir in seen:
                  continue
              manifest = pathlib.Path(provider_dir) / "manifest.yaml"
              if manifest.is_file():
                  seen.add(provider_dir)
                  providers.append(provider_dir)

          print(json.dumps(sorted(providers)))
          PY
          )

          gestalt_ref="$(tr -d '[:space:]' < .github/gestalt-ref)"
          if [ -z "$gestalt_ref" ]; then
            echo "missing .github/gestalt-ref" >&2
            exit 1
          fi

          {
            echo "providers=${providers}"
            echo "gestalt-ref=${gestalt_ref}"
          } >> "$GITHUB_OUTPUT"

  publish:
    needs: changed-providers
    if: needs.changed-providers.outputs.providers != '[]'
    strategy:
      fail-fast: false
      matrix:
        provider: ${{ fromJSON(needs.changed-providers.outputs.providers) }}
    uses: ./.github/workflows/publish-provider-snapshot.yml
    with:
      provider-ref: ${{ github.sha }}
      gestalt-ref: ${{ needs.changed-providers.outputs.gestalt-ref }}
      provider-dirs: ${{ matrix.provider }}
      dry-run: false
    secrets: inherit
