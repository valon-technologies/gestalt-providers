kind: app
source: github.com/valon-technologies/gestalt-providers/app/default
version: 0.0.1-alpha.2
displayName: Home
description: Default Gestalt UI bundle served at /.
iconFile: assets/icon.svg
install:
  - [bun, install, --frozen-lockfile]
build:
  - [bun, run, check]
  - [bun, run, gestalt, build]
  - [bun, run, build]
run:
  - [bun, run, gestalt, run, ., './provider.ts#provider']
spec:
  connections:
    default:
      auth:
        type: none
