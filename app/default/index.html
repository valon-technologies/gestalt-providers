<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Gestalt</title>
    <meta name="description" content="Integration management for Gestalt" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="/favicon-32x32.png" type="image/png" sizes="32x32" />
    <link rel="icon" href="/favicon-48x48.png" type="image/png" sizes="48x48" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <script type="application/json" id="gestalt-platform-brand">{}</script>
    <script>
      (function () {
        try {
          var el = document.getElementById("gestalt-platform-brand");
          var raw = el && el.textContent ? el.textContent.trim() : "";
          if (!raw || raw === "{}") return;
          var brand = JSON.parse(raw);
          if (!brand || typeof brand !== "object") return;
          window.__GESTALT_PLATFORM_BRAND__ = brand;
          if (typeof brand.name === "string" && brand.name.trim()) {
            document.title = brand.name.trim();
          }
        } catch (e) {}
      })();
    </script>
    <script>
      (function () {
        const media = window.matchMedia("(prefers-color-scheme: dark)");
        const getTheme = function () {
          const stored = localStorage.getItem("theme");
          return stored === "light" || stored === "dark" || stored === "system"
            ? stored
            : "system";
        };
        const applyTheme = function (theme) {
          const useDark =
            theme === "dark" || (theme === "system" && media.matches);
          document.documentElement.classList.toggle("dark", useDark);
        };

        applyTheme(getTheme());
        media.addEventListener("change", function () {
          if (getTheme() === "system") {
            applyTheme("system");
          }
        });
      })();
    </script>
    <link
      id="tenant-theme"
      rel="stylesheet"
      href="theme.css"
      data-theme-source="tenant"
    />
    <script>
      (function () {
        if (localStorage.getItem("gestalt-theme-source") === "default") {
          document.getElementById("tenant-theme")?.setAttribute("disabled", "");
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </head>
  <body class="font-sans antialiased">
    <div id="root"></div>
  </body>
</html>
